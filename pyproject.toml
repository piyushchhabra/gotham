[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gotham"
version = "1.0.0"
description = "Gotham City operations platform for the Batcave, GCPD and Arkham Asylum"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gotham = "gotham.__main__:main"

[tool.setuptools.packages.find]
include = ["gotham*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
